apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-redirector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hagi0929/url-redirector.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: url-redirector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
