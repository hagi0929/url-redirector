name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in deploy/deployment.yaml
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|" deploy/deployment.yaml
          echo "--- deployment.yaml image line ---"
          grep 'image:' deploy/deployment.yaml

      - name: Commit and push tag bump
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if git diff --quiet deploy/deployment.yaml; then
            echo "image tag unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git commit -m "ci: bump image to ${TAG}"
          git push
