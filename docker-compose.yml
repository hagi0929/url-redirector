services:
  redirector:
    build: .
    image: url-redirector:latest
    container_name: url-redirector
    restart: unless-stopped
    environment:
      HOST_PORT: "8080"
      ADMIN_HOST_PORT: "8081"
      DB_PATH: "/data/redirects.db"
      FALLBACK_URL: "${FALLBACK_URL:-}"
    ports:
      - "${HOST_PORT:-8080}:8080"
      - "${ADMIN_HOST_PORT:-8081}:8081"
    volumes:
      - redirector_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  redirector_data:
